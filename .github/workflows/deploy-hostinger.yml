name: Deploy to unklefunk.music

on:
  push:
    branches: ["main"]
    paths: ["website/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload files to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 195.179.239.223
          port: 65002
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          source: "website/index.html,website/style.css,website/main.js"
          target: "public_html/"
          strip_components: 1

      - name: Confirm deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 195.179.239.223
          port: 65002
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          script: |
            echo "=== unklefunk.music deployment complete ==="
            ls -lh ~/public_html/index.html ~/public_html/style.css ~/public_html/main.js
