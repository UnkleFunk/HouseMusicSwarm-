name: Diagnose Hostinger web root

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check web root contents
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: 195.179.239.223
          port: 65002
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          script: |
            echo "=== Home directory ==="
            ls -la ~/
            echo ""
            echo "=== Actual web root: ~/domains/unklefunk.music/public_html/ ==="
            ls -la ~/domains/unklefunk.music/public_html/
            echo ""
            echo "=== Legacy public_html (not served) ==="
            ls -la ~/public_html/
            echo ""
            echo "=== Index files ==="
            ls ~/domains/unklefunk.music/public_html/index* 2>/dev/null
            echo ""
            echo "=== Our index.html first line ==="
            head -3 ~/domains/unklefunk.music/public_html/index.html 2>/dev/null || echo "index.html not found"
