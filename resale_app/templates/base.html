<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Resale{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body {% block bodyattrs %}{% endblock %}>
  {% if mode == 'demo' %}
  <div class="banner">Demo mode: no model is looking at your photos. Details come from what you typed and from photo file names.</div>
  {% endif %}
  <nav class="topnav">
    <a class="brand" href="/">Resale</a>
    <a href="/upload">Upload</a>
    <a href="/review">Review</a>
    <a href="/items">Items</a>
    <a href="/export">Export</a>
  </nav>
  <main>
    {% if msg %}<p class="flash" role="status">{{ msg }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
